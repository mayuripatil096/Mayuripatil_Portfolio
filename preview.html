<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCity - Citizen Registration</title>
  
  <!-- Google Fonts: Sora & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#172554',
            'primary-light': '#1e3a8a',
            secondary: '#2563eb',
            accent: '#06b6d4',
            'accent-dark': '#0891b2',
            surface: '#f8fafc',
            'surface-blue': '#eff6ff',
          },
          fontFamily: {
            display: ['Sora', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- React 18 & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.6s ease-out both;
    }
  </style>
</head>
<body class="bg-slate-950 font-body text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Navigation and Routing simulation for local preview
    const Link = ({ to, children, className }) => (
      <a 
        href={to} 
        onClick={(e) => { 
          e.preventDefault(); 
          console.log('Navigating to:', to);
          if (to === '/') {
            alert('Navigation to Home Page (/)');
          } else if (to === '/login') {
            alert('Navigation to Login Page (/login)');
          }
        }} 
        className={className}
      >
        {children}
      </a>
    );

    const useNavigate = () => (to) => {
      console.log('Redirecting to:', to);
      alert('Registered! Redirecting to: ' + to);
    };

    // API Service simulation
    const api = {
      defaults: { baseURL: 'http://localhost:5000/api' },
      post: async (endpoint, data) => {
        console.log('API Request -> POST', endpoint, data);
        await new Promise(r => setTimeout(r, 700));
        return { data: { message: 'Citizen registered successfully' } };
      }
    };

    function Register() {
      const [form, setForm] = useState({ name: '', email: '', password: '', phone: '' });
      const [error, setError] = useState('');
      const [success, setSuccess] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [showPassword, setShowPassword] = useState(false);
      const navigate = useNavigate();

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);
        try {
          await api.post('/auth/register', { ...form, role: 'citizen' });
          setSuccess(true);
          setTimeout(() => navigate('/login'), 1500);
        } catch (err) {
          setError(err.response?.data?.error || 'Registration failed. Please try again.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleGoogleSignUp = () => {
        setError('');
        alert('Google Sign-Up initiated!\nIn production, redirects to: http://localhost:5000/api/auth/google');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between relative overflow-hidden font-body selection:bg-cyan-500/30 selection:text-cyan-200">
          
          {/* =========================================================
              BACKGROUND AMBIENT GLOWS & DIGITAL CIVIC GRID
          ========================================================= */}
          <div 
            className="absolute -top-40 -left-40 w-96 md:w-[600px] h-96 md:h-[600px] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none" 
            aria-hidden="true"
          />
          <div 
            className="absolute -bottom-40 -right-40 w-96 md:w-[650px] h-96 md:h-[650px] bg-blue-600/10 rounded-full blur-[140px] pointer-events-none" 
            aria-hidden="true"
          />
          <div 
            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-cyan-900/5 rounded-full blur-[160px] pointer-events-none" 
            aria-hidden="true"
          />

          <div 
            className="absolute inset-0 pointer-events-none opacity-[0.05]"
            style={{
              backgroundImage: `
                linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px)
              `,
              backgroundSize: '70px 70px',
            }}
            aria-hidden="true"
          />

          {/* =========================================================
              TOP NAVBAR / BRAND HEADER
          ========================================================= */}
          <header className="relative z-20 w-full max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
            <Link to="/" className="flex items-center gap-3 group focus:outline-none focus:ring-2 focus:ring-cyan-400 rounded-xl p-1 transition">
              <div className="w-10 h-10 rounded-xl bg-white/10 border border-white/20 backdrop-blur-md flex items-center justify-center shadow-lg transition duration-200 group-hover:bg-white/20 group-hover:border-cyan-400/40">
                <span className="text-cyan-300 text-lg font-bold">◆</span>
              </div>
              <div>
                <span className="text-xl font-display font-bold text-white leading-none tracking-tight block">
                  SmartCity
                </span>
                <span className="text-[9px] text-cyan-300/80 mt-1 tracking-[0.2em] uppercase font-semibold block">
                  Civic Connect
                </span>
              </div>
            </Link>

            <div className="flex items-center gap-4">
              <Link
                to="/"
                className="text-xs sm:text-sm font-medium text-slate-400 hover:text-white transition flex items-center gap-1.5"
              >
                <span>←</span> Back to Home
              </Link>
              <Link
                to="/login"
                className="hidden sm:inline-flex items-center px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 transition"
              >
                Sign In
              </Link>
            </div>
          </header>

          {/* =========================================================
              MAIN REGISTRATION CONTENT AREA
          ========================================================= */}
          <main className="relative z-10 flex-1 flex items-center justify-center px-4 sm:px-6 py-8 md:py-12">
            <div className="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

              {/* =====================================================
                  LEFT COLUMN: CIVIC SHOWCASE & PLATFORM VALUE (lg+)
              ===================================================== */}
              <div className="hidden lg:flex lg:col-span-5 flex-col justify-center space-y-8 animate-fade-up">
                
                <div className="inline-flex items-center gap-3 px-4 py-2 rounded-full bg-white/10 border border-white/20 backdrop-blur-md text-white text-xs font-medium w-fit">
                  <span className="relative flex h-2 w-2">
                    <span className="absolute inline-flex h-full w-full rounded-full bg-cyan-300 opacity-75 animate-ping" />
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-cyan-300" />
                  </span>
                  Building better communities together
                </div>

                <div>
                  <h2 className="font-display text-3xl xl:text-4xl font-bold text-white tracking-tight leading-tight">
                    Empower your neighborhood with{' '}
                    <span className="text-cyan-300">SmartCity</span>
                  </h2>
                  <p className="mt-4 text-slate-300 text-sm leading-relaxed">
                    Create a citizen account to report civic issues, track resolutions in real-time, and collaborate with municipal authorities for a cleaner, safer city.
                  </p>
                </div>

                <div className="space-y-4 pt-2">
                  <div className="flex items-start gap-3.5">
                    <div className="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-300 flex-shrink-0 text-base">
                      ⚡
                    </div>
                    <div>
                      <h3 className="text-sm font-semibold text-white">Instant Civic Reporting</h3>
                      <p className="text-xs text-slate-400 mt-0.5">Report road damages, water leaks, or streetlight outages in seconds.</p>
                    </div>
                  </div>

                  <div className="flex items-start gap-3.5">
                    <div className="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-300 flex-shrink-0 text-base">
                      📍
                    </div>
                    <div>
                      <h3 className="text-sm font-semibold text-white">Live Progress Tracking</h3>
                      <p className="text-xs text-slate-400 mt-0.5">Receive real-time updates as city teams inspect and resolve issues.</p>
                    </div>
                  </div>

                  <div className="flex items-start gap-3.5">
                    <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-300 flex-shrink-0 text-base">
                      ✓
                    </div>
                    <div>
                      <h3 className="text-sm font-semibold text-white">94% Resolution Rate</h3>
                      <p className="text-xs text-slate-400 mt-0.5">Verified civic engagement with 32+ municipal departments.</p>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/90 border border-white/10 rounded-2xl p-4 shadow-xl backdrop-blur-md">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                        ✓
                      </div>
                      <div>
                        <p className="text-xs font-semibold text-white">Streetlight Fixed</p>
                        <p className="text-[10px] text-slate-400">Resolved within 24 hours</p>
                      </div>
                    </div>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                      Verified
                    </span>
                  </div>
                </div>

              </div>

              {/* =====================================================
                  RIGHT COLUMN: REGISTRATION CARD
              ===================================================== */}
              <div className="lg:col-span-7 flex justify-center">
                <div className="w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 sm:p-9 shadow-2xl shadow-black/60 relative">
                  
                  <div className="absolute top-0 inset-x-8 h-px bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent" />

                  {/* Form Header */}
                  <div className="mb-6">
                    <div className="flex items-center justify-between mb-2">
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
                        <span className="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                        Citizen Portal
                      </span>
                      <span className="text-xs text-slate-400">Fast & Free</span>
                    </div>
                    
                    <h1 className="font-display text-2xl sm:text-3xl font-bold text-white tracking-tight">
                      Citizen Registration
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-400 mt-1">
                      Create your civic account to help build a cleaner, smarter city.
                    </p>
                  </div>

                  {/* Error & Success Alerts */}
                  {error && (
                    <div 
                      role="alert"
                      className="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs sm:text-sm flex items-start gap-2.5 animate-fade-up"
                    >
                      <svg className="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                      <span>{error}</span>
                    </div>
                  )}

                  {success && (
                    <div 
                      role="alert"
                      className="mb-5 p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs sm:text-sm flex items-start gap-2.5 animate-fade-up"
                    >
                      <svg className="w-4 h-4 text-emerald-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                      </svg>
                      <span>Registered successfully! Redirecting to login...</span>
                    </div>
                  )}

                  {/* =================================================
                      GOOGLE SIGN-UP BUTTON
                  ================================================= */}
                  <div className="mb-5">
                    <button
                      type="button"
                      id="google-signup-button"
                      onClick={handleGoogleSignUp}
                      className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-semibold text-sm shadow-md transition duration-200 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900 group"
                      aria-label="Continue with Google"
                    >
                      <svg className="w-4 h-4 sm:w-5 sm:h-5 flex-shrink-0 transition-transform group-hover:scale-105" viewBox="0 0 24 24">
                        <path
                          fill="#4285F4"
                          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        />
                        <path
                          fill="#34A853"
                          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        />
                        <path
                          fill="#FBBC05"
                          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                        />
                        <path
                          fill="#EA4335"
                          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                        />
                      </svg>
                      <span className="text-slate-900 font-medium tracking-tight">
                        Continue with Google
                      </span>
                    </button>
                  </div>

                  {/* =================================================
                      SUBTLE DIVIDER: OR
                  ================================================= */}
                  <div className="relative my-5">
                    <div className="absolute inset-0 flex items-center" aria-hidden="true">
                      <div className="w-full border-t border-slate-800" />
                    </div>
                    <div className="relative flex justify-center text-[11px] uppercase tracking-wider font-semibold">
                      <span className="bg-slate-900 px-3 text-slate-400">
                        Or register with email
                      </span>
                    </div>
                  </div>

                  {/* =================================================
                      REGISTRATION FORM
                  ================================================= */}
                  <form onSubmit={handleSubmit} className="space-y-4">
                    
                    {/* Full Name */}
                    <div>
                      <label htmlFor="register-name" className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Full Name <span className="text-cyan-400">*</span>
                      </label>
                      <div className="relative">
                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                          </svg>
                        </span>
                        <input
                          id="register-name"
                          type="text"
                          name="name"
                          value={form.name}
                          onChange={handleChange}
                          placeholder="e.g. Alex Morgan"
                          required
                          className="w-full bg-slate-950/70 border border-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition duration-150"
                        />
                      </div>
                    </div>

                    {/* Email Address */}
                    <div>
                      <label htmlFor="register-email" className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Email Address <span className="text-cyan-400">*</span>
                      </label>
                      <div className="relative">
                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                          </svg>
                        </span>
                        <input
                          id="register-email"
                          type="email"
                          name="email"
                          value={form.email}
                          onChange={handleChange}
                          placeholder="alex@example.com"
                          required
                          className="w-full bg-slate-950/70 border border-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition duration-150"
                        />
                      </div>
                    </div>

                    {/* Phone Number (Optional) */}
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label htmlFor="register-phone" className="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                          Phone Number
                        </label>
                        <span className="text-[11px] text-slate-400">Optional</span>
                      </div>
                      <div className="relative">
                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                          </svg>
                        </span>
                        <input
                          id="register-phone"
                          type="tel"
                          name="phone"
                          value={form.phone}
                          onChange={handleChange}
                          placeholder="+1 (555) 000-0000"
                          className="w-full bg-slate-950/70 border border-slate-800 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition duration-150"
                        />
                      </div>
                    </div>

                    {/* Password */}
                    <div>
                      <label htmlFor="register-password" className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Password <span className="text-cyan-400">*</span>
                      </label>
                      <div className="relative">
                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                          </svg>
                        </span>
                        <input
                          id="register-password"
                          type={showPassword ? 'text' : 'password'}
                          name="password"
                          value={form.password}
                          onChange={handleChange}
                          placeholder="••••••••"
                          required
                          className="w-full bg-slate-950/70 border border-slate-800 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition duration-150"
                        />
                        <button
                          type="button"
                          onClick={() => setShowPassword(!showPassword)}
                          className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none transition"
                          aria-label={showPassword ? 'Hide password' : 'Show password'}
                        >
                          {showPassword ? (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                          ) : (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                          )}
                        </button>
                      </div>
                    </div>

                    {/* Submit CTA Button */}
                    <div className="pt-2">
                      <button
                        type="submit"
                        disabled={isLoading || success}
                        className="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 disabled:opacity-60 disabled:cursor-not-allowed transition duration-200 shadow-lg shadow-cyan-900/30 hover:shadow-cyan-900/50 hover:-translate-y-0.5 active:translate-y-0 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-900"
                      >
                        {isLoading ? (
                          <>
                            <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-slate-950" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                            </svg>
                            Creating Account...
                          </>
                        ) : (
                          <>
                            <span>Create Citizen Account</span>
                            <span className="text-base">→</span>
                          </>
                        )}
